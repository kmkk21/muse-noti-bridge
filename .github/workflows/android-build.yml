name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests & Assemble Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename Release APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then TAG="latest"; fi
          cp app/build/outputs/apk/release/app-release.apk "MuseNotiBridge-${TAG}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseNotiBridge-release-apk
          path: MuseNotiBridge-*-release.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "MuseNotiBridge-${GITHUB_REF_NAME}-release.apk" \
            --title "Muse 알림 브릿지 ${GITHUB_REF_NAME}" \
            --notes "Meta Muse AI 전용 안드로이드 알림 브릿지 정식 릴리즈 빌드입니다.

          ### 주요 변경 사항 (${GITHUB_REF_NAME})
          - **5분 / 10분 / 15분 단축 배치 전송 주기 지원** (안드로이드 WorkManager 15분 제한 우회 + 상시 연결 타이머 + 중복 전송 방지 Mutex 적용)
          - 전용 Release 키스토어 서명 적용 (기존 v1.0.1 위에 바로 덮어쓰기 업데이트 가능, 설정 유지)
          - 대기 알림이 0건일 때는 전송하지 않아 토큰·배터리 소모 최소화"
